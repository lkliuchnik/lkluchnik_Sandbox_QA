name: Playwright Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Fast lane (pure API / stable UI tests)
        run: npx playwright test --grep-invert "@flaky-site"
        env:
          PLAYWRIGHT_HTML_REPORT: playwright-report/fast
      - name: Slow lane (tests that touch demoqa.com's unstable search/Profile rendering)
        id: slow_lane
        if: always()
        run: npx playwright test --grep "@flaky-site" --workers=1 --pass-with-no-tests
        env:
          PLAYWRIGHT_HTML_REPORT: playwright-report/slow
      - name: Note known flakiness in the job summary
        if: always() && steps.slow_lane.outcome == 'failure'
        run: echo "⚠️ Slow-lane (UI search) tests failed. This may be known demoqa.com flakiness, not a regression." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
